spring.application.name=TweakPay

## Spring Security
security.admin.name=admin
security.admin.password=Admin@1234
security.customer.name=customer
security.customer.password=Customer@1234

#Authentication
security.jwt.secret-key=88cd2108b5347d973cf39cdf9053d7dd42704876d8c9a9bd8e2d168259d3ddf7
security.jwt.expiration-time=3600000

db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:taskdb}

spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

## Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
